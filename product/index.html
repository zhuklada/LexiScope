<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiScope</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: white;
        }
    </style>
</head>

<body>

    <h1>LexiScope</h1>

    <p>AI-powered text analysis</p>

    <textarea placeholder="Enter your text here..."></textarea>

    

    <button>Analyze</button>

    <div class="result">
        <h2>Analysis</h2>
        <p>Your results will appear here.</p>
    </div>

</body>
</html>
